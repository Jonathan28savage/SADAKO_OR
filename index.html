<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KAKATUA</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        font-family: "Arial";
        font-weight: 500;
      }

      body {
        background: url("images/bck.jpg") no-repeat center center fixed;
        background-size: cover;
        padding: 0;
        margin: 0;
      }

      .container {
        margin-top: 50px;
      }

      .form-card {
        background: rgba(
          255,
          255,
          255,
          0.9
        ); /* Light white background with some transparency */
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      }

      .form-card .card-header {
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
      }

      .file {
        visibility: hidden;
        position: absolute;
      }

      a {
        color: blue;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="form-card">
        <div class="card">
          <div class="card-header text-center font-weight-bold">
            <h2>
              Kalkulator Kepatuhan Badan Usaha (KAKATUA) <br />
              BPJS Kesehatan Cabang Jakarta Utara
            </h2>
          </div>
            <form
              method="POST"
              id="dataForm"
              enctype="multipart/form-data"
              action="https://script.google.com/macros/s/AKfycbyNVz-jJ-Qx6Ijr47_TOvrehRGWQ-3h8_xxE4CB8UNRPcMBdlBcZaGJiT9oqgIapKtJ/exec"
              onsubmit="handleSubmit(event)"
            >
              <div class="form-group">
                <label for="Nama BU"
                  ><b>Nama Badan Usaha</b> <br />Tuliskan nama badan usaha
                  <b>TANPA</b> menggunakan "PT/CV/Yayasan/dsb" contoh: PT Sukses
                  Maju, maka cukup dituliskan "Sukses Maju"</label
                >
                <input
                  type="text"
                  name="Nama BU"
                  class="form-control"
                  id="Nama BU"
                  placeholder="Nama Badan Usaha"
                  required
                />
              </div>
              <div class="form-group">
                <label for="Kode BU"
                  ><b>Kode Badan Usaha</b> <br />
                  Contoh : 001165555</label
                >
                <input
                  type="text"
                  name="Kode BU"
                  class="form-control"
                  id="Kode BU"
                  placeholder="Kode Badan Usaha"
                  required
                />
              </div>
              <div class="form-group">
                <label for="PIC BU"><b>Nama PIC Badan Usaha</b></label>
                <input
                  type="text"
                  name="PIC BU"
                  class="form-control"
                  id="PIC BU"
                  placeholder="Nama PIC Badan Usaha"
                  required
                />
              </div>
              <div class="form-group">
                <label for="No.HP PIC"
                  ><b>No. Telepon (HP) PIC Badan Usaha</b></label
                >
                <input
                  type="text"
                  name="No.HP PIC"
                  class="form-control"
                  id="No.HP PIC"
                  placeholder="No. Handphone PIC Badan Usaha"
                  required
                />
              </div>
              <div class="form-group">
                <label for="Email PIC"><b>Email PIC Badan Usaha</b></label>
                <input
                  type="text"
                  name="Email PIC"
                  class="form-control"
                  id="Email PIC"
                  placeholder="Email PIC Badan Usaha"
                  required
                />
              </div>
              <div class="form-group">
                <label for="Pekerja Terdaftar BPJS"
                  ><b>Jumlah Pekerja Badan Usaha</b
                  ></label>
                <input
                  type="text"
                  name="Pekerja Terdaftar BPJS"
                  class="form-control"
                  id="Pekerja Terdaftar BPJS"
                  placeholder="Jumlah Pekerja Badan Usaha"
                  required
                />
              </div>
              <div class="form-group">
                <label for="Pekerja Belum Terdaftar BPJS"
                  ><b
                    >Jumlah Pekerja Terdaftar BPJS Kesehatan Badan Usaha</b
                  ></label
                >
                <input
                  type="text"
                  name="Pekerja Belum Terdaftar BPJS"
                  class="form-control"
                  id="Pekerja Belum Terdaftar BPJS"
                  placeholder="Jumlah Pekerja Terdaftar BPJS Kesehatan Badan Usaha"
                  required
                />
              </div>
              <div class="form-group">
                <label for="Keterangan">Keterangan</label>
                <textarea
                  class="form-control"
                  id="Keterangan"
                  name="Keterangan"
                  rows="3"
                ></textarea>
              </div>
              <div class="form-group mt-3">
  <label><b>Dengan ini saya menyatakan bahwa data yang diisikan adalah benar dan dapat dipertanggungjawabkan kebenarannya</b></label>
  <div class="form-check">
    <input
      class="form-check-input"
      type="radio"
      name="Konfirmasi Data"
      id="dataSesuai"
      value="Ya"
      required
    />
    <label class="form-check-label" for="dataSesuai">Ya</label>
  </div>
  <div class="form-check">
    <input
      class="form-check-input"
      type="radio"
      name="Konfirmasi Data"
      id="dataTidakSesuai"
      value="Tidak"
      required
    />
    <label class="form-check-label" for="dataTidakSesuai">Tidak</label>
  </div>
</div>
       <button type="submit" class="btn btn-success btn-block mt-2">
                Submit
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
